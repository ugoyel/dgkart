name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dgkart
          POSTGRES_PASSWORD: dgkart
          POSTGRES_DB: dgkart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dgkart" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: End-to-end smoke test
        run: |
          cp .env.example .env
          set -a; . ./.env; set +a
          SEED_ON_BOOT=500 node dist/main > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/health && break; sleep 1; done
          sleep 3
          node test/smoke.mjs || (cat api.log; exit 1)

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release app bundle (debug-signed in CI)
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.example.com
      - name: Build web
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.example.com
      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
