# One-click deploy of the API + Postgres on Render (free tier works for testing).
# Render dashboard > New > Blueprint > pick this repo. Then fill the env vars marked sync: false.
services:
  - type: web
    name: dgkart-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: dgkart-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PHONE
        value: "+919910123503"
      - key: AUTH_MODE
        value: firebase
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_SYNC
        value: "true"
      - key: SEED_ON_BOOT
        value: "1000"
databases:
  - name: dgkart-db
    plan: free
