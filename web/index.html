<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3BA8" />
    <meta name="description" content="DGkart.com: shop electronics, fashion, home and more with lightning deals, coupons, bank offers and festival sales." />
    <title>DGkart.com: India's marketplace for great deals</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>DGkart needs JavaScript to run.</noscript>
    <script>
      // If the app fails to start, show why instead of a blank page.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) { errors.push((e.message || 'Failed to load ' + ((e.target && (e.target.src || e.target.href)) || 'a file'))); }, true);
        window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount) return;
          root.innerHTML = '<div style="max-width:520px;margin:15vh auto;padding:24px;font:16px system-ui,sans-serif;text-align:center">' +
            '<h2>DGkart didn\u2019t load</h2><p>Please reload the page.</p>' +
            '<button onclick="location.reload()" style="padding:10px 20px;font-size:16px">Reload</button>' +
            '<p id="boot-details" style="color:#666;font-size:13px;margin-top:16px"></p></div>';
          document.getElementById('boot-details').textContent = 'Details: ' + (errors.join(' | ') || 'none') + ' \u00b7 ' + navigator.userAgent;
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
